# 门 3 —— CLI 契约：命令面 / 退出码 / --json 形状（照唯一一张退出码表）。
# 反例钉子：无子命令（坏用法）必须回退出码 2，绝不当成功。

[gate]
name = "cli"
cmd = ["python", "-m", "pytest", "tests/test_cli.py", "-q", "--junitxml=.pipe/evidence/junit/cli.xml"]
inputs = ["cli/main.py", "src/framework/exit_codes.py", "tests/test_cli.py"]
nail = "tests/test_cli.py::test_no_command_is_usage_error"
reuse = "never"
stage = "light"
timeout_s = 300
exit_ok = [0]
blocking = true
emits = ["junit"]
needs_runtime = ["python"]
